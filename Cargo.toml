[package]
name = "adio"
version = "1.2.0"
edition = "2021"
description = "Petit lecteur audio portable et ultra rapide"
license = "MIT"
repository = "https://github.com/joshsssn/Adio"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
raw-window-handle = "0.6"
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-all"] }
symphonia = { version = "0.5.4", features = ["all"] }
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
souvlaki = "0.8"
egui-phosphor = { version = "0.9", features = ["light", "regular", "fill"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1"
